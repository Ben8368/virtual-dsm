name: Publish image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0); publishes this tag and latest to GHCR'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Validate version and default branch
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Publish from the default branch only.' >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version must have the form 1.2.3.' >&2; exit 1; }
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    uses: ./.github/workflows/test.yml
  publish:
    name: Publish (${{ matrix.arch }})
    needs: [version, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION_ARG=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Verify published image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" virtual-dsm:release
          bash tests/image-architecture.sh virtual-dsm:release "$ARCH"
          docker run --rm --entrypoint qemu-system-aarch64 virtual-dsm:release --version
          docker run --rm --entrypoint qemu-system-x86_64 virtual-dsm:release --version
          bash tests/production-x86-command.sh
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error
  manifest:
    name: Publish multi-platform tags
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and inspect multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} == 2 ]]
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "Published \`$IMAGE:$VERSION\` and \`$IMAGE:latest\` for amd64 and arm64." >> "$GITHUB_STEP_SUMMARY"
