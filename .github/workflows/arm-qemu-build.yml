name: ARM QEMU production build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production runtime natively
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: virtual-dsm:phase1
          load: true
          cache-from: type=gha,scope=qemu-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=qemu-${{ matrix.platform }}
      - name: Verify both emulators
        run: |
          docker run --rm --entrypoint qemu-system-aarch64 virtual-dsm:phase1 --version
          docker run --rm --entrypoint qemu-system-x86_64 virtual-dsm:phase1 --version
      - name: Verify default production command
        if: matrix.platform == 'linux/amd64'
        run: bash tests/production-x86-command.sh virtual-dsm:phase1
